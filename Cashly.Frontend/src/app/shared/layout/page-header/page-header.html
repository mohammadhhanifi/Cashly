<header class="border rounded-md w-full py-sp-16 px-sp-24 bg-surface flex flex-1 gap-20">
  <div class="min-w-fit">
    <h1 class="mb-sp-8 text-h1">Categories</h1>
    <p class="text-text-secondary">Here's your financial overview.</p>
  </div>
  <div class="min-h-full flex">
    <button hlmBtn class="m-auto text-text-secondary">This Month
      <ng-icon name="matKeyboardArrowDownFillOutline" size="1.5rem"></ng-icon>
    </button>
  </div>

  <div class="w-full flex items-center justify-end gap-sp-16">
    <ng-icon name="matNotificationsOutline" size="1.7rem"
     class="hover:text-primary cursor-pointer">
     </ng-icon>

    <button hlmBtn class="text-text-secondary w-sp-48 rounded-full">
      <ng-icon name="matLightModeOutline" size="1.5rem"></ng-icon>
    </button>
    <!-- User Avatar -->
    <div class="border p-sp-8 rounded-full flex items-center gap-sp-8">
      <hlm-avatar class="size-sp-48 hover:cursor-pointer">
        <img hlmAvatarImage src='/avatar-1.webp' alt='spartan logo. Resembling a spartanic shield' />
        <span hlmAvatarFallback>Me</span>
      </hlm-avatar>
      <div>
        <p class="text-label">Hanifi</p>
        <p class="text-label text-text-secondary">@MohammadHHanifi</p>
      </div>
      <div class="p-sp-8 flex items-center hover:cursor-pointer group  ">
        <ng-icon name="matKeyboardArrowDownFillOutline" size="1.5rem"
          class="text-text-secondary group-hover:text-primary">
        </ng-icon>
      </div>
    </div>
  </div>
</header>
