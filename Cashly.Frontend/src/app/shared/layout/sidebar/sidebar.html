<div hlmSidebarWrapper>
  <hlm-sidebar>
    <div hlmSidebarHeader class="flex items-center justify-center my-20 bg-blue-400" >
      <p class="text-[78px]] font-semibold text-text-primary">
        <span class="text-primary">Cash</span>ly
      </p>
    </div>
    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of _items; track item.title) {
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton [routerLink]="item.url">
                <img [src]="item.icon" />
                <span>{{ item.title }}</span>
              </a>
            </li>
            }
          </ul>
        </div>
      </div>
    </div>
  </hlm-sidebar>

  <ng-content />
</div>
