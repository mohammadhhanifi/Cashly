<div hlmSidebarWrapper sidebarWidth="212px">
  <hlm-sidebar variant="floating" sidebarContainerClass="static h-auto min-h-svh block md:flex py-3 pl-3 pr-0">
    <div hlmSidebarHeader class="flex items-center justify-center py-8 px-4 ">
      <p class="text-[28px] font-semibold text-text-primary">
        <a routerLink="/" class="text-primary ">Cash</a><a routerLink="/">ly</a>
      </p>
    </div>
    <div hlmSidebarGroupContent class="px-2">
      <ul hlmSidebarMenu class="gap-5">
        @for (item of _items; track item.title) {
        <li hlmSidebarMenuItem>
          <a hlmSidebarMenuButton [routerLink]="item.url" routerLinkActive #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.url === '/' }" [isActive]="rla.isActive"
            class="h-12 gap-5 px-4 py-3 text-sm leading-normal font-medium not-data-[active=true]:hover:bg-primary-light hover:text-primary data-[active=true]:text-text-on-primary ">
            <ng-icon [name]="rla.isActive ? item.fillIcon : item.outlineIcon" size="24" />
            <span>{{ item.title }}</span>
          </a>
        </li>
        }
      </ul>
    </div>

    <!-- UpgradePlan Card : -->
    @if (cardVisible()==true) {
    <hlm-card size="sm" class="mx-2 max-w-sm my-10 p-2.5 rounded-md">
      <div class="flex mx-1 items-center">
        <a routerLink="/" class=" flex-auto size-6 shrink-0">
          <ng-icon [name]="_upgradeCard[0].fillIcon" size="24" [routerLink]="_upgradeCard[0].url"></ng-icon>
        </a>
        <div class="flex-auto w-full"></div>
        <button type="button" aria-label="Close upgrade card" (click)="upgrade()"
          class="flex size-8 shrink-0 items-center justify-center rounded-sm border hover:cursor-pointer hover:bg-expense hover:text-text-on-primary hover:border-none">
          <ng-icon [name]="_upgradeCard[1].fillIcon" size="24" aria-hidden="true" />
        </button>
      </div>
      <hlm-card-header class="p-0 pl-1 gap-3.5">
        <h3 hlmCardTitle>Upgrade to Pro. </h3>
        <p hlmCardDescription class="text-[11px]">Unlock more features and manage your finances better.</p>
      </hlm-card-header>
      <div class="border-none p-0 ">
        <button hlmBtn (click)="upgrade()"
          class="w-full h-fit py-3 px-4 rounded-md hover:cursor-pointer hover:bg-primary-light hover:text-primary bg-[#1E293B]">Upgrade
          Now</button>
      </div>
    </hlm-card>
    }

    <!-- Setting Menu Item : -->
    <div class=" mt-auto py-4 border-t">
      <ul hlmSidebarFooter>
        <li hlmSheetFooter>
          <a hlmSidebarMenuButton [routerLink]="_settings.url " routerLinkActive #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: _settings.url === '/' }" [isActive]="rla.isActive"
            class="h-12 gap-5 px-4 py-3 text-sm leading-normal font-medium   not-data-[active=true]:hover:bg-primary-light data-[active=true]:text-text-on-primary">
            <ng-icon [name]="rla.isActive ? _settings.fillIcon : _settings.outlineIcon" size="24" />
            <span>{{ _settings.title }}</span>
          </a>
        </li>
      </ul>
    </div>
  </hlm-sidebar>

  <ng-content />
</div>
